<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rang Palitrasi Generatori</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: #1a1a2e; color: #fff;
    transition: background 0.6s;
  }
  h1 { font-size: 2rem; margin-bottom: 10px; text-shadow: 0 0 20px rgba(255,255,255,.3); }
  .palette { display: flex; gap: 15px; margin: 25px 0; flex-wrap: wrap; justify-content: center; }
  .color-card {
    width: 130px; height: 170px; border-radius: 16px;
    cursor: pointer; transition: transform .3s, box-shadow .3s;
    display: flex; flex-direction: column; overflow: hidden;
    box-shadow: 0 8px 25px rgba(0,0,0,.3);
  }
  .color-card:hover { transform: translateY(-10px) scale(1.05); box-shadow: 0 15px 35px rgba(0,0,0,.5); }
  .color-fill { flex: 1; }
  .color-code {
    background: rgba(0,0,0,.7); padding: 8px; text-align: center;
    font-size: .85rem; font-weight: bold; letter-spacing: 1px;
  }
  button {
    padding: 14px 40px; font-size: 1.1rem; border: none;
    border-radius: 50px; cursor: pointer; font-weight: bold;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff; transition: transform .2s, box-shadow .2s;
    box-shadow: 0 5px 20px rgba(102,126,234,.4);
  }
  button:hover { transform: scale(1.08); box-shadow: 0 8px 30px rgba(102,126,234,.6); }
  button:active { transform: scale(.95); }
  .copied {
    position: fixed; top: 20px; background: #00b894;
    padding: 10px 25px; border-radius: 30px;
    font-weight: bold; animation: fadeInOut 1.2s forwards;
  }
  @keyframes fadeInOut {
    0% { opacity: 0; transform: translateY(-20px); }
    20% { opacity: 1; transform: translateY(0); }
    80% { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(-20px); }
  }
  p.hint { margin-top: 15px; opacity: .5; font-size: .85rem; }
</style>
</head>
<body>
  <h1>🎨 Rang Palitrasi</h1>
  <div class="palette" id="palette"></div>
  <button onclick="generate()">🔄 Yangi Ranglar</button>
  <p class="hint">Rang ustiga bosing — kod nusxalanadi (SPACE ham ishlaydi)</p>

<script>
  const palette = document.getElementById('palette');
  const randColor = () => '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6,'0');
  const luminance = (hex) => {
    const [r,g,b] = hex.match(/\w\w/g).map(c => parseInt(c,16)/255);
    return 0.299*r + 0.587*g + 0.114*b > 0.5 ? '#000' : '#fff';
  };

  function generate() {
    palette.innerHTML = '';
    const colors = Array.from({length: 5}, randColor);
    colors.forEach(color => {
      const card = document.createElement('div');
      card.className = 'color-card';
      card.innerHTML = `<div class="color-fill" style="background:${color}"></div>
        <div class="color-code" style="color:${luminance(color)}">${color.toUpperCase()}</div>`;
      card.onclick = () => { navigator.clipboard.writeText(color); showCopied(color); };
      palette.appendChild(card);
    });
    document.body.style.background = `linear-gradient(135deg, ${colors[0]}, ${colors[2]}, ${colors[4]})`;
  }

  function showCopied(color) {
    const el = document.createElement('div');
    el.className = 'copied'; el.textContent = `✅ ${color} nusxalandi!`;
    document.body.appendChild(el); setTimeout(() => el.remove(), 1300);
  }

  document.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); generate(); }});
  generate();
</script>
</body>
</html>
